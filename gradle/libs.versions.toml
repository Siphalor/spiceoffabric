[versions]
autoService = "1.1.1"
exp4j = "0.4.8"
fabric-loader = "0.19.2"
jcyo = "0.6.1"
jspecify = "1.0.0"
junit = "5.12.0"
lombok = "1.18.38"
modPublisher = "2.1.8"
shadow = "9.3.0"

[plugins]
jcyo = { id = "de.siphalor.jcyo", version.ref = "jcyo" }
modPublisher = { id = "com.hypherionmc.modutils.modpublisher", version.ref = "modPublisher" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
autoService = { group = "com.google.auto.service", name = "auto-service", version.ref = "autoService" }
exp4j = { group = "net.objecthunter", name = "exp4j", version.ref = "exp4j" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
junit-platform = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-core = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }

[bundles]
junit = [
    "junit-core",
    "junit-launcher",
]
